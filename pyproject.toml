[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "vortex-agent"
version = "0.2.0"
description = "A local, observable, and controllable Agent Runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99.0",
    "pydantic-settings>=2.10.1",
    "rich>=14.1.0",
    "textual>=5.3.0",
    "typer>=0.16.0",
]

[project.scripts]
vortex = "vortex.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.uv.build-backend]
module-name = "vortex"
source-exclude = [".DS_Store", ".env", ".env.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
testpaths = ["tests"]
